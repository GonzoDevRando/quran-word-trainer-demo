  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: النبات والطعام والمادة. The scene is generated from layered Arabic semantic terms and roots: ماء؛ ارض؛ ابل؛ شديد؛ لحم؛ نمو، اتساع، غذاء، مادة نافعة، رزق محسوس، زيادة/رزق، تغذية مثمرة؛ اكل؛ شدة؛ حمق؛ رقم؛ رمق؛ عقم؛ قحم؛ قدم.</desc>
