<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Visual entonym memory image for رن؛نر</title>
  <desc id="desc">A silent visual metaphor: dim sensing shifts into perception, touch, face, and embodied awareness.</desc>
  <defs>
    <linearGradient id="posterBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d2f3d"/>
      <stop offset="48%" stop-color="#b17b68"/>
      <stop offset="100%" stop-color="#f3d4a7"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="70%" cy="37%" r="46%">
