  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: الزمن والنور واللون. The scene is generated from layered Arabic semantic terms and roots: ماء؛ ارض؛ ابل؛ جاء؛ يوم؛ دورة، نور، حرارة/لون، تغير زمني؛ ثوب؛ لون؛ خدر؛ بدر؛ برد؛ ثرد؛ جدر؛ جرد.</desc>
