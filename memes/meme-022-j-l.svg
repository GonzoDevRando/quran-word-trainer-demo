  <circle cx="1459" cy="647" r="30" fill="#fff8df" opacity="0.11"/>
  <circle cx="420" cy="272" r="13" fill="#f5de8a" opacity="0.13"/>
  <circle cx="841" cy="747" r="30" fill="#fff8df" opacity="0.16"/>
  <circle cx="1262" cy="372" r="13" fill="#f5de8a" opacity="0.08"/>
  <circle cx="223" cy="847" r="30" fill="#fff8df" opacity="0.11"/>
