<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Visual entonym memory image for بث؛ثب</title>
  <desc id="desc">A silent visual metaphor: dry ground shifts into flowing water, oasis, and inhabitable place.</desc>
  <defs>
