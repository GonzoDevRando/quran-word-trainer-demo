      <stop offset="62%" stop-color="#c8fbff" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#c8fbff" stop-opacity="0"/>
    </radialGradient>
    <filter id="posterShadow" x="-20%" y="-20%" width="140%" height="150%">
