  <circle cx="883" cy="345" r="26" fill="#fff8df" opacity="0.11"/>
  <circle cx="1232" cy="748" r="9" fill="#ffdc62" opacity="0.13"/>
  <circle cx="121" cy="301" r="26" fill="#fff8df" opacity="0.16"/>
  <circle cx="470" cy="704" r="9" fill="#ffdc62" opacity="0.08"/>
  <circle cx="819" cy="257" r="26" fill="#fff8df" opacity="0.11"/>
