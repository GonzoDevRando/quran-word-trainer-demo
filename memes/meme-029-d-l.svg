  <circle cx="962" cy="238" r="13" fill="#ffdc62" opacity="0.13"/>
  <circle cx="1281" cy="611" r="30" fill="#fff8df" opacity="0.16"/>
  <circle cx="140" cy="134" r="13" fill="#ffdc62" opacity="0.08"/>
  <circle cx="459" cy="507" r="30" fill="#fff8df" opacity="0.11"/>
