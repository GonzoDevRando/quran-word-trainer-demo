<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Visual entonym memory image for حل؛لح</title>
  <desc id="desc">A silent visual metaphor: barren desert shifts into lush abundance and provision.</desc>
  <defs>
    <linearGradient id="posterBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f4634"/>
      <stop offset="48%" stop-color="#67a85f"/>
      <stop offset="100%" stop-color="#efd27a"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="30%" cy="47%" r="46%">
      <stop offset="0%" stop-color="#fff3ad" stop-opacity=".88"/>
      <stop offset="62%" stop-color="#fff3ad" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#fff3ad" stop-opacity="0"/>
    </radialGradient>
    <filter id="posterShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#140d08" flood-opacity=".32"/>
    </filter>
    <filter id="hardInk" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="6" dy="8" stdDeviation="0" flood-color="#12100c" flood-opacity=".34"/>
    </filter>
    <style>
      .ink { stroke: #16120d; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #16120d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#posterBg)"/>
  <rect width="1600" height="1000" fill="url(#warmGlow)"/>
  <circle cx="540" cy="414" r="13" fill="#f2b84d" opacity="0.08"/>
  <circle cx="383" cy="311" r="30" fill="#fff8df" opacity="0.11"/>
  <circle cx="226" cy="208" r="13" fill="#f2b84d" opacity="0.13"/>
  <circle cx="1529" cy="105" r="30" fill="#fff8df" opacity="0.16"/>
  <circle cx="1372" cy="852" r="13" fill="#f2b84d" opacity="0.08"/>
  <circle cx="1215" cy="749" r="30" fill="#fff8df" opacity="0.11"/>
  <circle cx="1058" cy="646" r="13" fill="#f2b84d" opacity="0.13"/>
  <circle cx="901" cy="543" r="30" fill="#fff8df" opacity="0.16"/>
  <circle cx="744" cy="440" r="13" fill="#f2b84d" opacity="0.08"/>
  <circle cx="587" cy="337" r="30" fill="#fff8df" opacity="0.11"/>
  <g filter="url(#posterShadow)">
    
    <g id="poster-growth-bowl">
      <path d="M440 520 C470 780 1130 780 1160 520Z" fill="#fff8df" class="ink"/>
      <ellipse cx="800" cy="520" rx="370" ry="120" fill="#f2b84d" class="ink"/>
      <circle cx="610" cy="430" r="58" fill="#d24e3d" class="ink"/>
      <circle cx="730" cy="388" r="64" fill="#f0c658" class="ink"/>
      <circle cx="870" cy="394" r="58" fill="#e76c46" class="ink"/>
      <circle cx="1000" cy="430" r="54" fill="#a6c851" class="ink"/>
      <path d="M432 810 C654 904 972 906 1190 802" fill="none" stroke="#fff3ad" stroke-width="18" stroke-linecap="round"/>
    </g>
  </g>
</svg>
