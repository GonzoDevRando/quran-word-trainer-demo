  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: القوة والقطع والضرب. The scene is generated from layered Arabic semantic terms and roots: ارض؛ ماء؛ ابل؛ جاء؛ شديد؛ اثر، ضرب، قطع، فصل بالقوة؛ حسن؛ شدة؛ سمر؛ سحر؛ سرا؛ ارس؛ اسر؛ بسر.</desc>
