<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Visual entonym memory image for طق؛قط</title>
  <desc id="desc">A silent visual metaphor: fracture and pressure shift into opening, separation, and released force.</desc>
  <defs>
    <linearGradient id="posterBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#201a20"/>
      <stop offset="48%" stop-color="#6a4b58"/>
      <stop offset="100%" stop-color="#d56a43"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="59%" cy="31%" r="46%">
      <stop offset="0%" stop-color="#ffe27b" stop-opacity=".88"/>
      <stop offset="62%" stop-color="#ffe27b" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#ffe27b" stop-opacity="0"/>
    </radialGradient>
    <filter id="posterShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#140d08" flood-opacity=".32"/>
    </filter>
    <filter id="hardInk" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="6" dy="8" stdDeviation="0" flood-color="#12100c" flood-opacity=".34"/>
    </filter>
    <style>
      .ink { stroke: #16120d; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #16120d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#posterBg)"/>
  <rect width="1600" height="1000" fill="url(#warmGlow)"/>
  <circle cx="1437" cy="303" r="40" fill="#ff8b5c" opacity="0.08"/>
  <circle cx="119" cy="499" r="23" fill="#fff8df" opacity="0.11"/>
  <circle cx="261" cy="695" r="40" fill="#ff8b5c" opacity="0.13"/>
  <circle cx="403" cy="891" r="23" fill="#fff8df" opacity="0.16"/>
  <circle cx="545" cy="237" r="40" fill="#ff8b5c" opacity="0.08"/>
  <circle cx="687" cy="433" r="23" fill="#fff8df" opacity="0.11"/>
  <circle cx="829" cy="629" r="40" fill="#ff8b5c" opacity="0.13"/>
  <circle cx="971" cy="825" r="23" fill="#fff8df" opacity="0.16"/>
  <circle cx="1113" cy="171" r="40" fill="#ff8b5c" opacity="0.08"/>
  <circle cx="1255" cy="367" r="23" fill="#fff8df" opacity="0.11"/>
  <g filter="url(#posterShadow)">
    
    <g id="poster-force-cut-rope">
      <path d="M190 426 C430 360 574 402 744 500" fill="none" stroke="#fff8df" stroke-width="44" stroke-linecap="round"/>
      <path d="M856 500 C1030 598 1180 640 1410 574" fill="none" stroke="#fff8df" stroke-width="44" stroke-linecap="round"/>
      <path d="M706 312 L894 690 M894 312 L706 690" stroke="#ffe27b" stroke-width="28" stroke-linecap="round"/>
      <circle cx="800" cy="500" r="100" fill="#ff8b5c" opacity=".82" class="ink"/>
    </g>
  </g>
</svg>
