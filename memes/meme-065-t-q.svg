<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Visual entonym memory image for طق؛قط</title>
  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: القوة والقطع والضرب. The scene is generated from layered Arabic semantic terms and roots: ارض؛ ماء؛ ضرب؛ مراة؛ الضم؛ اثر، ضرب، قطع، فصل بالقوة؛ قاف؛ انثي؛ طلق؛ لقط؛ سقط؛ طبق؛ طرق؛ طوق.</desc>
