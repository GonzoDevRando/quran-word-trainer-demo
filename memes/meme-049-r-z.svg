<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Visual entonym memory image for رز؛زر</title>
  <desc id="desc">A silent visual metaphor: barren desert shifts into lush abundance and provision.</desc>
