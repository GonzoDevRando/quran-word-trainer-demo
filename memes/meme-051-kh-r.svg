<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Visual entonym memory image for خر؛رخ</title>
  <desc id="desc">A silent visual metaphor: mute stillness shifts into expanding waves, call, and named resonance.</desc>
  <defs>
    <linearGradient id="posterBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#162f44"/>
      <stop offset="48%" stop-color="#3c6d8d"/>
      <stop offset="100%" stop-color="#b6e2e8"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="68%" cy="55%" r="46%">
      <stop offset="0%" stop-color="#dfffff" stop-opacity=".88"/>
      <stop offset="62%" stop-color="#dfffff" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#dfffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="posterShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#140d08" flood-opacity=".32"/>
    </filter>
    <filter id="hardInk" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="6" dy="8" stdDeviation="0" flood-color="#12100c" flood-opacity=".34"/>
    </filter>
    <style>
      .ink { stroke: #16120d; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #16120d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#posterBg)"/>
  <rect width="1600" height="1000" fill="url(#warmGlow)"/>
  <circle cx="1454" cy="782" r="31" fill="#9ee6ff" opacity="0.08"/>
  <circle cx="1115" cy="867" r="14" fill="#fff8df" opacity="0.11"/>
  <circle cx="776" cy="102" r="31" fill="#9ee6ff" opacity="0.13"/>
  <circle cx="437" cy="187" r="14" fill="#fff8df" opacity="0.16"/>
  <circle cx="98" cy="272" r="31" fill="#9ee6ff" opacity="0.08"/>
  <circle cx="1219" cy="357" r="14" fill="#fff8df" opacity="0.11"/>
  <circle cx="880" cy="442" r="31" fill="#9ee6ff" opacity="0.13"/>
  <circle cx="541" cy="527" r="14" fill="#fff8df" opacity="0.16"/>
  <circle cx="202" cy="612" r="31" fill="#9ee6ff" opacity="0.08"/>
  <circle cx="1323" cy="697" r="14" fill="#fff8df" opacity="0.11"/>
  <g filter="url(#posterShadow)">
    
    <g id="poster-sound-strings">
      <path d="M344 220 C560 418 552 620 340 818 M564 180 C744 400 744 600 564 820 M800 160 C900 384 900 616 800 840 M1036 180 C856 400 856 600 1036 820 M1256 220 C1040 418 1048 620 1260 818" fill="none" stroke="#fff8df" stroke-width="16" stroke-linecap="round" opacity=".8"/>
      <circle cx="800" cy="500" r="118" fill="#9ee6ff" class="ink"/>
      <circle cx="800" cy="500" r="48" fill="#dfffff"/>
    </g>
  </g>
</svg>
