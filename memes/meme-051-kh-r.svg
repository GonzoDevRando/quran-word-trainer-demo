  <title id="title">Visual entonym memory image for خر؛رخ</title>
  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: الصوت والكلام والاسم. The scene is generated from layered Arabic semantic terms and roots: ماء؛ صوت؛ يوم؛ ارض؛ ريح؛ صوت، نطق، تسمية، علامة؛ انف؛ لبن؛ خدر؛ اخر؛ خبر؛ خرب؛ خرت؛ خرج.</desc>
