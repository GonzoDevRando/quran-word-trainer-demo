<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Visual entonym memory image for رل؛لر</title>
  <desc id="desc">A silent visual metaphor: empty tracks shift into movement, carrying, and a living path.</desc>
  <defs>
    <linearGradient id="posterBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b2a22"/>
      <stop offset="48%" stop-color="#a7784c"/>
      <stop offset="100%" stop-color="#dfc27d"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="36%" cy="38%" r="46%">
      <stop offset="0%" stop-color="#ffe1a1" stop-opacity=".88"/>
      <stop offset="62%" stop-color="#ffe1a1" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#ffe1a1" stop-opacity="0"/>
    </radialGradient>
    <filter id="posterShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#140d08" flood-opacity=".32"/>
    </filter>
    <filter id="hardInk" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="6" dy="8" stdDeviation="0" flood-color="#12100c" flood-opacity=".34"/>
    </filter>
    <style>
      .ink { stroke: #16120d; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #16120d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#posterBg)"/>
  <rect width="1600" height="1000" fill="url(#warmGlow)"/>
  <circle cx="1258" cy="750" r="25" fill="#f8c76b" opacity="0.08"/>
  <circle cx="367" cy="523" r="42" fill="#fff8df" opacity="0.11"/>
  <circle cx="936" cy="296" r="25" fill="#f8c76b" opacity="0.13"/>
  <circle cx="1505" cy="69" r="42" fill="#fff8df" opacity="0.16"/>
  <circle cx="614" cy="692" r="25" fill="#f8c76b" opacity="0.08"/>
  <circle cx="1183" cy="465" r="42" fill="#fff8df" opacity="0.11"/>
  <circle cx="292" cy="238" r="25" fill="#f8c76b" opacity="0.13"/>
  <circle cx="861" cy="861" r="42" fill="#fff8df" opacity="0.16"/>
  <circle cx="1430" cy="634" r="25" fill="#f8c76b" opacity="0.08"/>
  <circle cx="539" cy="407" r="42" fill="#fff8df" opacity="0.11"/>
  <g filter="url(#posterShadow)">
    
    <g id="poster-animal-saddle-path">
      <path d="M476 566 C562 390 970 390 1058 566 C920 518 620 518 476 566Z" fill="#fff8df" class="ink"/>
      <path d="M558 566 C632 468 896 468 976 566" fill="#f8c76b" class="thin"/>
      <path d="M312 790 C560 686 966 686 1290 790" fill="none" stroke="#ffe1a1" stroke-width="30" stroke-linecap="round"/>
      <path d="M488 632 L488 742 M1044 632 L1044 742" stroke="#16120d" stroke-width="18" stroke-linecap="round"/>
    </g>
  </g>
</svg>
