  <circle cx="150" cy="612" r="17" fill="#ffdc62" opacity="0.13"/>
  <circle cx="541" cy="207" r="34" fill="#fff8df" opacity="0.16"/>
  <circle cx="932" cy="652" r="17" fill="#ffdc62" opacity="0.08"/>
  <circle cx="1323" cy="247" r="34" fill="#fff8df" opacity="0.11"/>
