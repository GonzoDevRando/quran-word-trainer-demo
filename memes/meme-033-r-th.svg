  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: النبات والطعام والمادة. The icon clusters are generated from layered Arabic semantic terms and roots: ارض؛ ماء؛ مال؛ لبن؛ ثير؛ نمو، اتساع، غذاء، مادة نافعة، رزق محسوس، زيادة/رزق، تغذية مثمرة؛ كثير؛ تمر؛ رثا؛ اثر؛ ثار؛ ثبر؛ ثرا؛ ثرد.</desc>
