  <title id="title">Visual entonym memory image for دع؛عد</title>
  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: القوة والقطع والضرب. The scene is generated from layered Arabic semantic terms and roots: ارض؛ ابل؛ شديد؛ ماء؛ فرس؛ اثر، ضرب، قطع، فصل بالقوة؛ ذين؛ جعل؛ عدا؛ بدع؛ بعد؛ جدع؛ جعد؛ خدع.</desc>
