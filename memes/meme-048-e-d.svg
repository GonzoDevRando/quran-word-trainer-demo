<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Visual entonym memory image for دع؛عد</title>
  <desc id="desc">A silent visual metaphor: fracture and pressure shift into opening, separation, and released force.</desc>
  <defs>
    <linearGradient id="posterBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#201a20"/>
      <stop offset="48%" stop-color="#6a4b58"/>
      <stop offset="100%" stop-color="#d56a43"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="52%" cy="54%" r="46%">
      <stop offset="0%" stop-color="#ffe27b" stop-opacity=".88"/>
      <stop offset="62%" stop-color="#ffe27b" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#ffe27b" stop-opacity="0"/>
    </radialGradient>
    <filter id="posterShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#140d08" flood-opacity=".32"/>
    </filter>
    <filter id="hardInk" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="6" dy="8" stdDeviation="0" flood-color="#12100c" flood-opacity=".34"/>
    </filter>
    <style>
      .ink { stroke: #16120d; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #16120d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#posterBg)"/>
  <rect width="1600" height="1000" fill="url(#warmGlow)"/>
  <circle cx="1391" cy="731" r="14" fill="#ff8b5c" opacity="0.08"/>
  <circle cx="1031" cy="425" r="31" fill="#fff8df" opacity="0.11"/>
  <circle cx="671" cy="119" r="14" fill="#ff8b5c" opacity="0.13"/>
  <circle cx="311" cy="663" r="31" fill="#fff8df" opacity="0.16"/>
  <circle cx="1411" cy="357" r="14" fill="#ff8b5c" opacity="0.08"/>
  <circle cx="1051" cy="901" r="31" fill="#fff8df" opacity="0.11"/>
  <circle cx="691" cy="595" r="14" fill="#ff8b5c" opacity="0.13"/>
  <circle cx="331" cy="289" r="31" fill="#fff8df" opacity="0.16"/>
  <circle cx="1431" cy="833" r="14" fill="#ff8b5c" opacity="0.08"/>
  <circle cx="1071" cy="527" r="31" fill="#fff8df" opacity="0.11"/>
  <g filter="url(#posterShadow)">
    
    <g id="poster-force-lightning">
      <path d="M870 120 L488 542 L744 520 L626 880 L1118 392 L830 426Z" fill="#ffe27b" class="ink"/>
      <path d="M266 750 L606 610 M1000 374 L1360 230" stroke="#fff8df" stroke-width="22" stroke-linecap="round" opacity=".72"/>
    </g>
  </g>
</svg>
