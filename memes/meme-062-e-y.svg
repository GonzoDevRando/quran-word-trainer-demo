<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Visual entonym memory image for عي؛يع</title>
  <desc id="desc">A silent visual metaphor: empty tracks shift into movement, carrying, and a living path.</desc>
  <defs>
    <linearGradient id="posterBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b2a22"/>
      <stop offset="48%" stop-color="#a7784c"/>
      <stop offset="100%" stop-color="#dfc27d"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="46%" cy="33%" r="46%">
      <stop offset="0%" stop-color="#ffe1a1" stop-opacity=".88"/>
      <stop offset="62%" stop-color="#ffe1a1" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#ffe1a1" stop-opacity="0"/>
    </radialGradient>
    <filter id="posterShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#140d08" flood-opacity=".32"/>
    </filter>
    <filter id="hardInk" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="6" dy="8" stdDeviation="0" flood-color="#12100c" flood-opacity=".34"/>
    </filter>
    <style>
      .ink { stroke: #16120d; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #16120d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#posterBg)"/>
  <rect width="1600" height="1000" fill="url(#warmGlow)"/>
  <circle cx="1128" cy="870" r="39" fill="#f8c76b" opacity="0.08"/>
  <circle cx="1167" cy="113" r="22" fill="#fff8df" opacity="0.11"/>
  <circle cx="1206" cy="206" r="39" fill="#f8c76b" opacity="0.13"/>
  <circle cx="1245" cy="299" r="22" fill="#fff8df" opacity="0.16"/>
  <circle cx="1284" cy="392" r="39" fill="#f8c76b" opacity="0.08"/>
  <circle cx="1323" cy="485" r="22" fill="#fff8df" opacity="0.11"/>
  <circle cx="1362" cy="578" r="39" fill="#f8c76b" opacity="0.13"/>
  <circle cx="1401" cy="671" r="22" fill="#fff8df" opacity="0.16"/>
  <circle cx="1440" cy="764" r="39" fill="#f8c76b" opacity="0.08"/>
  <circle cx="1479" cy="857" r="22" fill="#fff8df" opacity="0.11"/>
  <g filter="url(#posterShadow)">
    
    <g id="poster-animal-bird-lift">
      <path d="M232 560 C500 284 700 352 800 560 C904 352 1100 284 1368 560 C1128 520 968 636 800 760 C632 636 472 520 232 560Z" fill="#fff8df" class="ink"/>
      <path d="M530 660 C664 604 936 604 1070 660" fill="none" stroke="#f8c76b" stroke-width="20" stroke-linecap="round"/>
      <circle cx="800" cy="562" r="46" fill="#ffe1a1" class="ink"/>
    </g>
  </g>
</svg>
