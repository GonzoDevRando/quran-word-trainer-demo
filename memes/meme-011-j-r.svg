  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: المكان والارض والماء. The scene is generated from layered Arabic semantic terms and roots: ارض؛ ماء؛ ابل؛ ناقة؛ صوت؛ موضع، ارض، ماء، عبور، علامة لفظية؛ بطن؛ عظيم؛ رجا؛ جرا؛ اجر؛ بجر؛ برج؛ جبر.</desc>
