<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Visual entonym memory image for جر؛رج</title>
  <desc id="desc">A silent visual metaphor: dry ground shifts into flowing water, oasis, and inhabitable place.</desc>
  <defs>
    <linearGradient id="posterBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#163c4b"/>
      <stop offset="48%" stop-color="#4aa3a4"/>
      <stop offset="100%" stop-color="#e4c37a"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="47%" cy="39%" r="46%">
      <stop offset="0%" stop-color="#c8fbff" stop-opacity=".88"/>
      <stop offset="62%" stop-color="#c8fbff" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#c8fbff" stop-opacity="0"/>
    </radialGradient>
    <filter id="posterShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#140d08" flood-opacity=".32"/>
    </filter>
    <filter id="hardInk" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="6" dy="8" stdDeviation="0" flood-color="#12100c" flood-opacity=".34"/>
    </filter>
    <style>
      .ink { stroke: #16120d; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #16120d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#posterBg)"/>
  <rect width="1600" height="1000" fill="url(#warmGlow)"/>
  <circle cx="1156" cy="376" r="25" fill="#f5de8a" opacity="0.08"/>
  <circle cx="231" cy="115" r="42" fill="#fff8df" opacity="0.11"/>
  <circle cx="766" cy="704" r="25" fill="#f5de8a" opacity="0.13"/>
  <circle cx="1301" cy="443" r="42" fill="#fff8df" opacity="0.16"/>
  <circle cx="376" cy="182" r="25" fill="#f5de8a" opacity="0.08"/>
  <circle cx="911" cy="771" r="42" fill="#fff8df" opacity="0.11"/>
  <circle cx="1446" cy="510" r="25" fill="#f5de8a" opacity="0.13"/>
  <circle cx="521" cy="249" r="42" fill="#fff8df" opacity="0.16"/>
  <circle cx="1056" cy="838" r="25" fill="#f5de8a" opacity="0.08"/>
  <circle cx="131" cy="577" r="42" fill="#fff8df" opacity="0.11"/>
  <g filter="url(#posterShadow)">
    
    <g id="poster-place-mountain-pass">
      <path d="M120 812 L456 276 L738 812Z" fill="#236d7a" class="ink"/>
      <path d="M584 812 L960 202 L1406 812Z" fill="#fff8df" opacity=".72" class="ink"/>
      <path d="M724 812 C780 666 822 590 884 520 C938 656 1040 742 1198 812" fill="#c8fbff" opacity=".75"/>
      <path d="M774 322 L914 322 L960 202 L1038 322 L1180 322" fill="none" stroke="#c8fbff" stroke-width="16" stroke-linecap="round"/>
    </g>
  </g>
</svg>
