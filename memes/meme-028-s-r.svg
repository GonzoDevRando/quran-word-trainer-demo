  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: النبات والطعام والمادة. The scene is generated from layered Arabic semantic terms and roots: ماء؛ لبن؛ ارض؛ وجل؛ جاء؛ نمو، اتساع، غذاء، مادة نافعة، رزق محسوس، تغذية مثمرة؛ برد؛ نخل؛ صار؛ اصر؛ برص؛ بصر؛ حصر؛ خرص.</desc>
