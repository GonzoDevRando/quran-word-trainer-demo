  <circle cx="441" cy="143" r="40" fill="#fff8df" opacity="0.16"/>
  <circle cx="1076" cy="832" r="23" fill="#9ee6ff" opacity="0.08"/>
  <circle cx="251" cy="671" r="40" fill="#fff8df" opacity="0.11"/>
  <circle cx="886" cy="510" r="23" fill="#9ee6ff" opacity="0.13"/>
  <circle cx="1521" cy="349" r="40" fill="#fff8df" opacity="0.16"/>
  <circle cx="696" cy="188" r="23" fill="#9ee6ff" opacity="0.08"/>
  <circle cx="1331" cy="877" r="40" fill="#fff8df" opacity="0.11"/>
