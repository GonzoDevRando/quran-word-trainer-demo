  <title id="title">Visual entonym memory image for قق</title>
  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: الصوت والكلام والاسم. The scene is generated from layered Arabic semantic terms and roots: صوت؛ ارض؛ ماء؛ الحق؛ قاق؛ صوت، نطق، تسمية، علامة؛ حكاية؛ طاءر؛ بقق؛ حقق؛ دقق؛ رقق؛ شقق؛ عقق.</desc>
