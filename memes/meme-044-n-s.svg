<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Visual entonym memory image for سن؛نس</title>
  <desc id="desc">A silent visual metaphor: dusk and heat shift into cycle, dawn, illumination, and color.</desc>
  <defs>
    <linearGradient id="posterBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#30233d"/>
      <stop offset="48%" stop-color="#bd5f4e"/>
      <stop offset="100%" stop-color="#f5c46b"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="44%" cy="56%" r="46%">
      <stop offset="0%" stop-color="#fff2a5" stop-opacity=".88"/>
      <stop offset="62%" stop-color="#fff2a5" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#fff2a5" stop-opacity="0"/>
    </radialGradient>
    <filter id="posterShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#140d08" flood-opacity=".32"/>
    </filter>
    <filter id="hardInk" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="6" dy="8" stdDeviation="0" flood-color="#12100c" flood-opacity=".34"/>
    </filter>
    <style>
      .ink { stroke: #16120d; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #16120d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#posterBg)"/>
  <rect width="1600" height="1000" fill="url(#warmGlow)"/>
  <circle cx="1417" cy="483" r="10" fill="#84e5ff" opacity="0.08"/>
  <circle cx="579" cy="309" r="27" fill="#fff8df" opacity="0.11"/>
  <circle cx="1201" cy="135" r="10" fill="#84e5ff" opacity="0.13"/>
  <circle cx="363" cy="811" r="27" fill="#fff8df" opacity="0.16"/>
  <circle cx="985" cy="637" r="10" fill="#84e5ff" opacity="0.08"/>
  <circle cx="147" cy="463" r="27" fill="#fff8df" opacity="0.11"/>
  <circle cx="769" cy="289" r="10" fill="#84e5ff" opacity="0.13"/>
  <circle cx="1391" cy="115" r="27" fill="#fff8df" opacity="0.16"/>
  <circle cx="553" cy="791" r="10" fill="#84e5ff" opacity="0.08"/>
  <circle cx="1175" cy="617" r="27" fill="#fff8df" opacity="0.11"/>
  <g filter="url(#posterShadow)">
    
    <g id="poster-time-phases">
      <path d="M190 710 C425 292 836 232 1400 328" fill="none" stroke="#fff8df" stroke-width="20" stroke-linecap="round" opacity=".62"/>
      <circle cx="330" cy="630" r="82" fill="#30233d" class="ink"/>
      <circle cx="560" cy="438" r="88" fill="#84e5ff" class="ink"/>
      <circle cx="842" cy="340" r="100" fill="#fff2a5" class="ink"/>
      <circle cx="1150" cy="312" r="86" fill="#84e5ff" class="ink"/>
      <circle cx="1370" cy="352" r="68" fill="#fff8df" class="ink"/>
    </g>
  </g>
</svg>
