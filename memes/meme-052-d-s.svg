  <title id="title">Visual entonym memory image for دس؛سد</title>
  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: القدر والقيمة والحال. The scene is generated from layered Arabic semantic terms and roots: ارض؛ ماء؛ ليل؛ ابل؛ ثوب؛ قدر، قيمة، زيادة/نقص، حال، نقص/احتياج؛ سير؛ وجل؛ سود؛ جسد؛ حسد؛ درس؛ دسس؛ دسع.</desc>
