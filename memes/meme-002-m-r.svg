  <title id="title">Visual entonym memory image for رم؛مر</title>
  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: الزمن والنور واللون. The scene is generated from layered Arabic semantic terms and roots: ارض؛ ماء؛ ناقة؛ ابل؛ فرس؛ دورة، نور، حرارة/لون، تغير زمني؛ نار؛ مرة؛ عمر؛ سمر؛ ارم؛ امر؛ برم؛ تمر.</desc>
