  <circle cx="1435" cy="599" r="27" fill="#fff8df" opacity="0.11"/>
  <circle cx="393" cy="221" r="10" fill="#efc45b" opacity="0.13"/>
  <circle cx="811" cy="693" r="27" fill="#fff8df" opacity="0.16"/>
