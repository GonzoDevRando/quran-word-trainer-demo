  <circle cx="1463" cy="285" r="18" fill="#fff8df" opacity="0.11"/>
  <circle cx="242" cy="578" r="35" fill="#ffd058" opacity="0.13"/>
  <circle cx="481" cy="871" r="18" fill="#fff8df" opacity="0.16"/>
  <circle cx="720" cy="314" r="35" fill="#ffd058" opacity="0.08"/>
  <circle cx="959" cy="607" r="18" fill="#fff8df" opacity="0.11"/>
