      <polygon points="620,560 740,508 860,560 740,612" fill="#fff8df" class="thin"/><polygon points="620,560 740,612 740,772 620,720" fill="#fff8df" opacity=".72" class="thin"/><polygon points="740,612 860,560 860,720 740,772" fill="#fff8df" opacity=".52" class="thin"/>
      <polygon points="750,470 870,418 990,470 870,522" fill="#ffd058" class="thin"/><polygon points="750,470 870,522 870,682 750,630" fill="#ffd058" opacity=".72" class="thin"/><polygon points="870,522 990,470 990,630 870,682" fill="#ffd058" opacity=".52" class="thin"/>
      <polygon points="880,380 1000,328 1120,380 1000,432" fill="#fff1a4" class="thin"/><polygon points="880,380 1000,432 1000,592 880,540" fill="#fff1a4" opacity=".72" class="thin"/><polygon points="1000,432 1120,380 1120,540 1000,592" fill="#fff1a4" opacity=".52" class="thin"/>
