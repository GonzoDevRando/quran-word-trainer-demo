  <circle cx="1187" cy="103" r="30" fill="#fff8df" opacity="0.11"/>
  <circle cx="114" cy="544" r="13" fill="#ffdd85" opacity="0.13"/>
  <circle cx="501" cy="135" r="30" fill="#fff8df" opacity="0.16"/>
  <circle cx="888" cy="576" r="13" fill="#ffdd85" opacity="0.08"/>
