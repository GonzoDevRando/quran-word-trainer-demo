<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Visual entonym memory image for له؛هل</title>
  <desc id="desc">A silent visual metaphor: isolation shifts into gathering, relation, covenant, and sacred orientation.</desc>
  <defs>
    <linearGradient id="posterBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2b3d"/>
      <stop offset="48%" stop-color="#78606a"/>
      <stop offset="100%" stop-color="#e6bd78"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="34%" cy="31%" r="46%">
      <stop offset="0%" stop-color="#fff0b0" stop-opacity=".88"/>
      <stop offset="62%" stop-color="#fff0b0" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#fff0b0" stop-opacity="0"/>
    </radialGradient>
    <filter id="posterShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#140d08" flood-opacity=".32"/>
    </filter>
    <filter id="hardInk" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="6" dy="8" stdDeviation="0" flood-color="#12100c" flood-opacity=".34"/>
    </filter>
    <style>
      .ink { stroke: #16120d; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #16120d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#posterBg)"/>
