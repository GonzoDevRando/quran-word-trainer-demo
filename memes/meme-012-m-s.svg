  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: المكان والارض والماء. The scene is generated from layered Arabic semantic terms and roots: ماء؛ ارض؛ ابل؛ ناقة؛ ليل؛ موضع، ارض، ماء، عبور؛ خير؛ سبيل؛ سمر؛ مسا؛ امس؛ حسم؛ حمس؛ خمس.</desc>
