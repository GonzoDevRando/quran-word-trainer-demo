  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: النبات والطعام والمادة. The scene is generated from layered Arabic semantic terms and roots: ارض؛ ابل؛ ناقة؛ ماء؛ لبن؛ نمو، اتساع، غذاء، مادة نافعة، رزق محسوس، تغذية مثمرة؛ رجال؛ خلق؛ جدع؛ جذع؛ جرع؛ جزع؛ جعد؛ جعر.</desc>
