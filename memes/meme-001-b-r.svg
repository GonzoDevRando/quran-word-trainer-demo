      <stop offset="46%" stop-color="#ffe886" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#ffe886" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#241207" flood-opacity=".28"/>
    </filter>
    <filter id="inkShadow" x="-20%" y="-20%" width="140%" height="150%">
