  <title id="title">Visual shift meme for بر؛رب</title>
  <desc id="desc">A silent visual metaphor: barren desert shifts into lush abundance and provision.</desc>
  <defs>
    <linearGradient id="skyLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d66f34"/>
      <stop offset="52%" stop-color="#f2ad57"/>
      <stop offset="100%" stop-color="#c97832"/>
    </linearGradient>
    <linearGradient id="skyRight" x1="0" y1="0" x2="0" y2="1">
