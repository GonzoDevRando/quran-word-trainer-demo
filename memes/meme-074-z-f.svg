  <title id="title">Visual entonym memory image for ظف؛فظ</title>
  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: البدن والحس. The scene is generated from layered Arabic semantic terms and roots: ارض؛ نفسه؛ ماء؛ فاظ؛ اظت؛ بدن، ملامسة، حس، اثر داخلي/خارجي؛ غليظ؛ انسان؛ حفظ؛ ظفر؛ ظلف؛ ظرف؛ فظظ؛ فيظ.</desc>
