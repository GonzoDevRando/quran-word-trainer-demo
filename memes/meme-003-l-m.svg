  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: النبات والطعام والمادة. The scene is generated from layered Arabic semantic terms and roots: ماء؛ ارض؛ مال؛ ابل؛ لمة؛ نمو، اتساع، غذاء، مادة نافعة، رزق محسوس، زيادة/رزق، تغذية مثمرة؛ رجال؛ طعام؛ ملا؛ لما؛ ثمل؛ جمل؛ حلم؛ حمل.</desc>
