  <title id="title">Visual entonym memory image for فق؛قف</title>
  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: البدن والحس. The scene is generated from layered Arabic semantic terms and roots: ماء؛ ارض؛ راس؛ راسه؛ قفة؛ بدن، ملامسة، حس، اثر داخلي/خارجي؛ احمر؛ صار؛ فقا؛ قفا؛ افق؛ خفق؛ دفق؛ رفق.</desc>
