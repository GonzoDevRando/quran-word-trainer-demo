  <title id="title">Visual entonym memory image for ري؛ير</title>
  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: القدر والقيمة والحال. The scene is generated from layered Arabic semantic terms and roots: ماء؛ فضل؛ ارض؛ ناقة؛ راية؛ قدر، قيمة، زيادة/نقص، حال؛ صار؛ دابة؛ روي؛ اري؛ بري؛ حري؛ حير؛ خير.</desc>
