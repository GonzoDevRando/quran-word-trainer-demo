<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Visual entonym memory image for ري؛ير</title>
  <desc id="desc">A silent visual metaphor: emptiness shifts into measure, balance, value, and change of state.</desc>
  <defs>
    <linearGradient id="posterBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#352820"/>
      <stop offset="48%" stop-color="#8e6947"/>
      <stop offset="100%" stop-color="#e6c16d"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="46%" cy="28%" r="46%">
      <stop offset="0%" stop-color="#fff2b0" stop-opacity=".88"/>
      <stop offset="62%" stop-color="#fff2b0" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#fff2b0" stop-opacity="0"/>
    </radialGradient>
    <filter id="posterShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#140d08" flood-opacity=".32"/>
    </filter>
    <filter id="hardInk" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="6" dy="8" stdDeviation="0" flood-color="#12100c" flood-opacity=".34"/>
    </filter>
    <style>
      .ink { stroke: #16120d; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #16120d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#posterBg)"/>
  <rect width="1600" height="1000" fill="url(#warmGlow)"/>
  <circle cx="503" cy="785" r="22" fill="#ffd75b" opacity="0.08"/>
  <circle cx="1307" cy="793" r="39" fill="#fff8df" opacity="0.11"/>
  <circle cx="651" cy="801" r="22" fill="#ffd75b" opacity="0.13"/>
  <circle cx="1455" cy="809" r="39" fill="#fff8df" opacity="0.16"/>
  <circle cx="799" cy="817" r="22" fill="#ffd75b" opacity="0.08"/>
  <circle cx="143" cy="825" r="39" fill="#fff8df" opacity="0.11"/>
  <circle cx="947" cy="833" r="22" fill="#ffd75b" opacity="0.13"/>
  <circle cx="291" cy="841" r="39" fill="#fff8df" opacity="0.16"/>
  <circle cx="1095" cy="849" r="22" fill="#ffd75b" opacity="0.08"/>
  <circle cx="439" cy="857" r="39" fill="#fff8df" opacity="0.11"/>
  <g filter="url(#posterShadow)">
    
    <g id="poster-value-measure">
      <path d="M590 210 L1010 210 L942 832 L658 832Z" fill="#fff8df" opacity=".82" class="ink"/>
      <path d="M640 630 C764 552 842 708 962 620 L942 832 L658 832Z" fill="#ffd75b" opacity=".88"/>
      <path d="M1084 300 L1216 300 M1084 408 L1266 408 M1084 516 L1216 516 M1084 624 L1266 624" stroke="#fff8df" stroke-width="18" stroke-linecap="round"/>
      <circle cx="404" cy="662" r="78" fill="#fff2b0" class="ink"/>
    </g>
  </g>
</svg>
