<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Visual entonym memory image for عم؛مع</title>
  <desc id="desc">A silent visual metaphor: tangled ground shifts into a clear route, crossing, and arrival.</desc>
  <defs>
    <linearGradient id="posterBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4142"/>
      <stop offset="48%" stop-color="#3e8b78"/>
      <stop offset="100%" stop-color="#e7b96b"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="43%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#f7e9a6" stop-opacity=".88"/>
      <stop offset="62%" stop-color="#f7e9a6" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#f7e9a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="posterShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#140d08" flood-opacity=".32"/>
    </filter>
    <filter id="hardInk" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="6" dy="8" stdDeviation="0" flood-color="#12100c" flood-opacity=".34"/>
    </filter>
    <style>
      .ink { stroke: #16120d; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #16120d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#posterBg)"/>
  <rect width="1600" height="1000" fill="url(#warmGlow)"/>
  <circle cx="444" cy="912" r="15" fill="#b8f0d7" opacity="0.08"/>
  <circle cx="255" cy="777" r="32" fill="#fff8df" opacity="0.11"/>
  <circle cx="1526" cy="642" r="15" fill="#b8f0d7" opacity="0.13"/>
  <circle cx="1337" cy="507" r="32" fill="#fff8df" opacity="0.16"/>
  <circle cx="1148" cy="372" r="15" fill="#b8f0d7" opacity="0.08"/>
  <circle cx="959" cy="237" r="32" fill="#fff8df" opacity="0.11"/>
  <circle cx="770" cy="102" r="15" fill="#b8f0d7" opacity="0.13"/>
  <circle cx="581" cy="817" r="32" fill="#fff8df" opacity="0.16"/>
  <circle cx="392" cy="682" r="15" fill="#b8f0d7" opacity="0.08"/>
  <circle cx="203" cy="547" r="32" fill="#fff8df" opacity="0.11"/>
  <g filter="url(#posterShadow)">
    
    <g id="poster-movement-compass">
      <circle cx="800" cy="500" r="314" fill="#fff8df" opacity=".38" class="ink"/>
      <path d="M800 156 L910 504 L800 844 L690 504Z" fill="#b8f0d7" class="ink"/>
      <path d="M456 500 L804 390 L1144 500 L804 610Z" fill="#f7e9a6" opacity=".88" class="ink"/>
      <circle cx="800" cy="500" r="56" fill="#fff8df" class="ink"/>
    </g>
  </g>
</svg>
