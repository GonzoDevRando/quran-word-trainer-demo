  <title id="title">Visual entonym memory image for حص؛صح</title>
  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: النبات والطعام والمادة. The icon clusters are generated from layered Arabic semantic terms and roots: ارض؛ ذهب؛ لبن؛ ناقة؛ حصاة؛ نمو، اتساع، غذاء، مادة نافعة، رزق محسوس، زيادة/رزق، تغذية مثمرة؛ سيف؛ شديد؛ حصب؛ حصد؛ حصر؛ حصص؛ حصل؛ حصن.</desc>
