  <title id="title">Visual entonym memory image for صم؛مص</title>
  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: القوة والقطع والضرب. The scene is generated from layered Arabic semantic terms and roots: شديد؛ ماء؛ ارض؛ ابل؛ ذهب؛ اثر، ضرب، قطع، فصل بالقوة؛ بطن؛ نخل؛ خصم؛ خمص؛ صرم؛ صمت؛ صمع؛ صمم.</desc>
