<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Visual entonym memory image for صم؛مص</title>
  <desc id="desc">A silent visual metaphor: fracture and pressure shift into opening, separation, and released force.</desc>
  <defs>
    <linearGradient id="posterBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f1f24"/>
      <stop offset="48%" stop-color="#9d4535"/>
      <stop offset="100%" stop-color="#ffb45d"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="56%" cy="43%" r="46%">
      <stop offset="0%" stop-color="#fff085" stop-opacity=".88"/>
      <stop offset="62%" stop-color="#fff085" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#fff085" stop-opacity="0"/>
    </radialGradient>
    <filter id="posterShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#140d08" flood-opacity=".32"/>
    </filter>
    <filter id="hardInk" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="6" dy="8" stdDeviation="0" flood-color="#12100c" flood-opacity=".34"/>
    </filter>
    <style>
      .ink { stroke: #16120d; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #16120d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#posterBg)"/>
  <rect width="1600" height="1000" fill="url(#warmGlow)"/>
  <circle cx="1158" cy="130" r="15" fill="#ffd36d" opacity="0.08"/>
  <circle cx="1207" cy="233" r="32" fill="#fff8df" opacity="0.11"/>
  <circle cx="1256" cy="336" r="15" fill="#ffd36d" opacity="0.13"/>
  <circle cx="1305" cy="439" r="32" fill="#fff8df" opacity="0.16"/>
  <circle cx="1354" cy="542" r="15" fill="#ffd36d" opacity="0.08"/>
  <circle cx="1403" cy="645" r="32" fill="#fff8df" opacity="0.11"/>
  <circle cx="1452" cy="748" r="15" fill="#ffd36d" opacity="0.13"/>
  <circle cx="1501" cy="851" r="32" fill="#fff8df" opacity="0.16"/>
  <circle cx="90" cy="104" r="15" fill="#ffd36d" opacity="0.08"/>
  <circle cx="139" cy="207" r="32" fill="#fff8df" opacity="0.11"/>
  <g filter="url(#posterShadow)">
    
    <g id="poster-force-split-rock">
      <path d="M266 790 L586 206 L770 528 L652 790Z" fill="#561d1a" class="ink"/>
      <path d="M724 790 L846 528 L1030 206 L1334 790Z" fill="#fff8df" opacity=".72" class="ink"/>
      <path d="M770 528 L834 424 L846 528 L774 638 L790 790" fill="none" stroke="#fff085" stroke-width="18" stroke-linecap="round"/>
      <path d="M150 838 L1450 838" stroke="#16120d" stroke-width="22" stroke-linecap="round"/>
    </g>
  </g>
</svg>
