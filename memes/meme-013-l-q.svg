  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: النبات والطعام والمادة. The scene is generated from layered Arabic semantic terms and roots: ماء؛ ارض؛ ناقة؛ طعام؛ عمر؛ نمو، اتساع، غذاء، مادة نافعة، رزق محسوس، زيادة/رزق، تغذية مثمرة؛ زرع؛ تحريك؛ حلق؛ طلق؛ لقط؛ الق؛ بقل؛ بلق.</desc>
