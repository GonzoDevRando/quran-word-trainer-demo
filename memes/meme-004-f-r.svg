  <title id="title">Visual entonym memory image for رف؛فر</title>
  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: النبات والطعام والمادة. The icon clusters are generated from layered Arabic semantic terms and roots: ارض؛ ماء؛ ابل؛ مراة؛ مال؛ نمو، اتساع، غذاء، مادة نافعة، رزق محسوس، زيادة/رزق، تغذية مثمرة؛ فاء؛ نساء؛ رفا؛ فرا؛ جرف؛ جفر؛ حرف؛ حفر.</desc>
