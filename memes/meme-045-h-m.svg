  <circle cx="1339" cy="407" r="15" fill="#fff8df" opacity="0.11"/>
  <circle cx="285" cy="867" r="32" fill="#a8e5ff" opacity="0.13"/>
  <circle cx="691" cy="477" r="15" fill="#fff8df" opacity="0.16"/>
