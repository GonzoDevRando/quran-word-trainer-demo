  <title id="title">Visual entonym memory image for مه؛هم</title>
  <desc id="desc">A silent pair-specific visual memory image. Neighborhood: الصوت والكلام والاسم. The scene is generated from layered Arabic semantic terms and roots: ماء؛ ابل؛ ارض؛ صوت؛ فرس؛ صوت، نطق، تسمية، علامة؛ وجه؛ ليل؛ بهم؛ تهم؛ دهم؛ زهم؛ سهم؛ مها.</desc>
