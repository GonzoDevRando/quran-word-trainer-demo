<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Visual entonym memory image for رو؛ور</title>
  <desc id="desc">A silent visual metaphor: emptiness shifts into measure, balance, value, and change of state.</desc>
  <defs>
    <linearGradient id="posterBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#352820"/>
      <stop offset="48%" stop-color="#8e6947"/>
      <stop offset="100%" stop-color="#e6c16d"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="53%" cy="25%" r="46%">
      <stop offset="0%" stop-color="#fff2b0" stop-opacity=".88"/>
      <stop offset="62%" stop-color="#fff2b0" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#fff2b0" stop-opacity="0"/>
    </radialGradient>
    <filter id="posterShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#140d08" flood-opacity=".32"/>
    </filter>
    <filter id="hardInk" x="-20%" y="-20%" width="140%" height="150%">
